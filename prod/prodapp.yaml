runtime: python311
entrypoint: gunicorn -b :$PORT main:app
handlers:
- url: /studyjams-id/?
  script: main.app
  # secure: always
- url: /intl/id/studyjams-id/?
  script: main.app
  # secure: always

# PDF files
- url: /(.*\.pdf)
  # secure: always
  static_files: build/\1
  upload: build/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      # script-src 'none';

# Static assets (anything with a file extension)
- url: /(.*\..*)
  secure: always
  static_files: build/\1
  upload: build/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      # script-src 'none';

# Root
- url: /
  secure: always
  static_files: build/index.html
  upload: build/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      # script-src 'none';

# Paths with a trailing slash
- url: /(.*\/)
  secure: always
  static_files: build/\1index.html
  upload: build/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      # script-src 'none';

# Paths without a trailing slash
- url: /(.*)?
  secure: always
  static_files: build/\1/index.html
  upload: build/(.*)
  http_headers:
    X-Frame-Options: "DENY"
    Strict-Transport-Security: "max-age=2592000; includeSubdomains"
    X-Content-Type-Options: "nosniff"
    X-XSS-Protection: "1; mode=block"
    Content-Security-Policy:
      base-uri 'none';
      object-src 'none';
      # script-src 'none';
